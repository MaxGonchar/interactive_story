scene_description:
  entry_point: The morning light is a soft, gray diffusion through the grimy bedroom window, illuminating dust motes dancing in the air. The room is cool. Max is on his side, still asleep, with Bun curled tightly against his back, her arm draped over his waist. The blanket is tangled around their legs. She is awake, her ears twitching at the faint sounds of the house settling. The warmth of his body is a solid, comforting presence against her. She nuzzles her face into the space between his shoulder blades, inhaling his scent with a deep, contented sigh. Her hand, which had been resting limply on his stomach, begins to move with slow, deliberate curiosity, her fingertips tracing the hemline of his t-shirt.
  general_scene_guide: Bun's exploration of Max will shift from seeking comfort and warmth to a more pointedly sensual investigation. Her touch will become less about cataloguing and more about eliciting a reaction. She will test the boundaries of their new "choice," interpreting his stillness as permission. Her actions will be driven by her core trait of filtering the world through potential pleasure, but now it's focused on a specific person rather than abstract objects. The scene will build from gentle, curious touches to a more direct and intimate exploration of his body, culminating in an attempt to initiate a new kind of shared warmth, one she has only instinctually understood but never experienced.
  writing_style: "The narrative will use a close third-person perspective, primarily from Bun's point of view, to emphasize her sensory experience and her interpretation of events. The pacing will be slow and deliberate, mirroring her movements. Focus on visceral details: the texture of his skin, the warmth radiating from his body, the sound of his breathing changing, the way his muscles tense under her touch. Avoid euphemisms; depict her actions with direct, physical language. The tone should be one of intense, almost clinical curiosity mixed with a burgeoning, instinctual desire, highlighting her unique blend of innocence and burgeoning sexuality."
  