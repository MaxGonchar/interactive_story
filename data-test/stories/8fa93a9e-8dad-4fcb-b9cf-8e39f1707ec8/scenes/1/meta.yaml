scene_description:
  general_scene_guide: 'Ren will not approach with words or overt actions. His focus
    will be a palpable, almost psychic force—a projection of raw, sexual energy directed
    entirely at Mila. This silent attention will begin to wear down her defenses.
    Initially, she will try to analyze it, to categorize it as another unpredictable
    variable, but the sheer, animalistic weight of his stare will bypass her intellect.
    It will manifest physically: a flush on her skin, a hitch in her breathing, a
    growing warmth that is both unsettling and compelling. Her role as the detached
    observer will crumble as she becomes the unwilling object of a primal force she
    cannot control or explain, forcing her into the messy, emotional dynamic she has
    been watching from afar.'
  writing_style: 'The narrative will shift to a tight third-person perspective centered
    on Mila, to emphasize her internal reaction to Ren''s silent attention. The pacing
    will be slow and deliberate, mirroring the patient, unwavering nature of his gaze.
    Focus on visceral, sensory details: the feeling of his stare like a physical touch,
    the sound of her own heartbeat in her ears, the prickle of sweat on her skin,
    the involuntary clenching of her muscles. The language should be stark and physical,
    avoiding metaphor in favor of direct sensation to convey the overwhelming, animalistic
    nature of the exchange.'
